name: Deploy Backend Symfony to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:    # Permite lanzarlo manualmente desde la pestaña Actions

env:
  # ====================================================================
  # AJUSTA ESTAS DOS VARIABLES A TU CASO
  # ====================================================================
  AWS_REGION: us-east-1            # Tu región AWS (mira arriba a la derecha en la consola)
  ECR_REPOSITORY: backend          # Nombre del repo ECR creado en el Paso 1.1
  # ====================================================================

jobs:
  build-and-push:
    name: Build & push image to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # Configurar credenciales AWS.
      # OJO: en Learner Lab caducan cada pocas horas, hay que actualizar
      # los tres secrets en GitHub cuando reinicies el lab.
      - name: Configurar credenciales AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push de la imagen Docker
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Descargar task definition actual
        run: |
          aws ecs describe-task-definition \
            --task-definition backend-task \
            --query taskDefinition \
            --region ${{ env.AWS_REGION }} \
            > task-definition.json

      - name: Actualizar imagen en task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ steps.ecr-login.outputs.registry }}/backend:${{ github.sha }}

      - name: Desplegar nueva task definition en ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: backend-service
          cluster: backend-cluster
          wait-for-service-stability: false

      - name: Resumen
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Imagen subida a ECR:"
          echo "  $ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "  $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # ----------------------------------------------------------------
      # FASE 2 (la añadiremos al final del despliegue):
      # - Render new task definition con la imagen nueva
      # - aws ecs update-service --force-new-deployment
      # Por ahora, solo build + push.
      # ----------------------------------------------------------------
