<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    
    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        # Symfony front controller: cualquier ruta no encontrada cae a index.php
        FallbackResource /index.php
    </Directory>
    # Evita que FallbackResource intercepte assets reales en /bundles/...
    <Directory /var/www/html/public/bundles>
        FallbackResource disabled
    </Directory>
    # Logs van a stdout/stderr para que CloudWatch los capture
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
